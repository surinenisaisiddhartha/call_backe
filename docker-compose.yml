version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    restart: always
    environment:
      - DATABASE_URL=sqlite:////app/data/local_test.db
      - JWT_SECRET=demo_secret_key_12345678
      # You can override other environment variables in Coolify settings:
      # - RETELL_API_KEY=your_retell_key
      # - SMTP_SERVER=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USERNAME=saisiddhartha234@gmail.com
      # - SMTP_PASSWORD=your_app_password
      # - SMTP_FROM_EMAIL=saisiddhartha234@gmail.com
    ports:
      - "5000:5000"
    volumes:
      - aegis-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: aegis-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  aegis-data:
