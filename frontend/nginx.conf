server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy api requests or keep them separate
    # Since we use direct backend URL in the frontend, no proxy is strictly required,
    # but try_files is needed for fallback routing.
}
